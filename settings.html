<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7paws 设置</title>
  </head>
  <body class="settings-body">
    <div id="menu" class="menu" role="menu">
      <div class="menu-head">
        <span class="menu-title">7paws</span>
        <button id="closeBtn" class="menu-close" type="button" aria-label="关闭设置">×</button>
      </div>

      <div class="menu-scroll">
        <div class="menu-section">
          <div class="menu-label">毛色</div>
          <div id="coats" class="coat-grid"></div>
        </div>

        <div id="customCoat" class="menu-section custom-coat" hidden>
          <div class="menu-label">
            <span>我的猫</span>
            <span class="menu-hint">照片只在本机取色</span>
          </div>
          <div class="color-row">
            <button class="color-slot" type="button" data-slot="fur"><span class="color-dot"></span><span>主色</span></button>
            <button class="color-slot" type="button" data-slot="patch"><span class="color-dot"></span><span>花色</span></button>
            <button class="color-slot" type="button" data-slot="accent"><span class="color-dot"></span><span>第三色</span></button>
            <button class="color-slot" type="button" data-slot="eye"><span class="color-dot"></span><span>眼睛</span></button>
          </div>
          <div class="custom-row">
            <span class="menu-label">花纹</span>
            <button id="patternSelect" class="dropdown" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="花纹">
              <span class="dropdown-label">双色</span>
              <span class="dropdown-caret">▾</span>
            </button>
          </div>
          <button id="photoBtn" class="btn photo-btn" type="button">从照片取色</button>
          <input id="photoInput" type="file" accept="image/*" hidden />
        </div>

        <div class="menu-section">
          <div class="menu-label">
            <span>大小</span>
            <span id="scaleValue" class="menu-value">100%</span>
          </div>
          <input id="scaleSlider" class="slider" type="range" min="10" max="150" step="5" />
        </div>

        <div class="menu-section">
          <div class="menu-label">
            <span>透明度</span>
            <span id="opacityValue" class="menu-value">100%</span>
          </div>
          <input id="opacitySlider" class="slider" type="range" min="10" max="100" step="5" />
        </div>

        <div class="menu-section menu-row">
          <span class="menu-label">键盘</span>
          <button id="layoutSelect" class="dropdown" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="键盘布局">
            <span class="dropdown-label">65% 紧凑</span>
            <span class="dropdown-caret">▾</span>
          </button>
        </div>

        <div class="menu-section menu-row">
          <span class="menu-label">多久睡着</span>
          <button id="sleepSelect" class="dropdown" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="睡眠时间">
            <span class="dropdown-label">5 分钟</span>
            <span class="dropdown-caret">▾</span>
          </button>
        </div>

        <div class="menu-section menu-toggles">
          <label class="toggle-row" for="leftMouse">
            <span>鼠标在左手边</span>
            <input id="leftMouse" type="checkbox" />
          </label>
          <label class="toggle-row" for="clickThroughLocked" title="锁定后整窗穿透，按住 Alt 临时恢复鼠标操作">
            <span>锁定鼠标穿透（Alt 解锁）</span>
            <input id="clickThroughLocked" type="checkbox" />
          </label>
          <label class="toggle-row" for="showTrayIcon">
            <span>显示托盘图标</span>
            <input id="showTrayIcon" type="checkbox" />
          </label>
          <label class="toggle-row" for="autostart">
            <span>开机自启</span>
            <input id="autostart" type="checkbox" />
          </label>
          <label class="toggle-row" for="privacyMode">
            <span>隐私模式</span>
            <input id="privacyMode" type="checkbox" />
          </label>
          <label class="toggle-row" for="purrPet">
            <span>按住呼噜声</span>
            <input id="purrPet" type="checkbox" />
          </label>
          <label class="toggle-row" for="purrSleep">
            <span>自动睡眠呼噜声</span>
            <input id="purrSleep" type="checkbox" />
          </label>
          <label class="toggle-row" for="showKeyLabels">
            <span>显示按键字母</span>
            <input id="showKeyLabels" type="checkbox" />
          </label>
        </div>
      </div>

      <div class="menu-actions">
        <button id="resetPosBtn" class="btn ghost" type="button">回到右下角</button>
        <button id="quitBtn" class="btn danger" type="button">退出</button>
      </div>
    </div>

    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
